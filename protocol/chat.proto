syntax = "proto3";

package chat;

option java_package = "com.chat.proto";
option java_outer_classname = "ChatProto";





message ClientRequest {
  enum RequestType {
    JOIN         = 0;
    CHAT         = 1;
    PRIVATE_CHAT = 2;
  }

  RequestType type = 1;

  oneof payload {
    JoinRequest join = 2;
    ChatRequest chat = 3;
    PrivateChatRequest private_chat = 4;
  }
  uint32 protocol_version = 100;
  string request_id = 101;
}


message JoinRequest {
  string name        = 1;
  optional bytes avatar      = 2;
  string avatar_mime = 3;
}


message ChatRequest {
  string text       = 1;
  optional bytes image     = 2;
  string image_mime = 3;
}


message PrivateChatRequest {
  string target_name = 1;
  string text        = 2;
  optional bytes image      = 3;
  string image_mime  = 4;
}





message ServerResponse {
  enum ResponseType {
    JOIN_SUCCESS    = 0;
    JOIN_ERROR      = 1;
    NEW_MESSAGE     = 2;
    PRIVATE_MESSAGE = 3;
    ERROR           = 4;
    USER_JOINED     = 5;
    USER_LEFT       = 6;
    HISTORY_BATCH   = 7;
  }

  ResponseType type = 1;

  oneof payload {
    JoinSuccessResponse join_success = 2;
    ErrorResponse error = 3;
    BroadcastMessage broadcast = 4;
    PrivateMessage private_msg = 5;
    UserEvent user_event = 6;
    HistoryBatch history_batch = 7;
  }
  uint32 protocol_version = 100;
  string request_id = 101;
}


message JoinSuccessResponse {
  reserved 1, 2, 3; // Old single-response history is intentionally incompatible.
  int32 active_users = 4;
  repeated string users = 5;
  uint64 snapshot_sequence = 6;
}


message HistoryMessage {
  string         sender_name       = 1;
  string         text              = 2;
  int64          timestamp         = 3;
  bool           has_image         = 4;
  optional bytes image             = 5;
  string         image_mime        = 6;
  bool           is_private        = 7;
  optional bytes sender_avatar     = 8;
  string         sender_avatar_mime = 9;
  string message_id = 10;
  uint64 sequence = 11;
}


message BroadcastMessage {
  string         sender_name      = 1;
  string         text             = 2;
  int64          timestamp        = 3;
  bool           has_image        = 4;
  optional bytes image            = 5;
  string         image_mime       = 6;
  optional bytes sender_avatar    = 7;
  string         sender_avatar_mime = 8;
  string message_id = 9;
  uint64 sequence = 10;
}


message PrivateMessage {
  string         sender_name = 1;
  string         text        = 2;
  int64          timestamp   = 3;
  bool           has_image   = 4;
  optional bytes image       = 5;
  string         image_mime  = 6;
  string message_id = 7;
  string target_name = 8;
}


message UserEvent {
  string user_name    = 1;
  bool   joined       = 2;
  int32  active_users = 3;
}


message ErrorResponse {
  int32  error_code    = 1;
  string error_message = 2;
  string code = 3;
}

// All batches correlate to JOIN. Live events follow the final batch.
message HistoryBatch {
  repeated HistoryMessage history = 1;
  uint64 snapshot_sequence = 2;
  bool complete = 3;
  optional bytes last_image = 4;
  string last_image_mime = 5;
  string last_image_message_id = 6;
}
